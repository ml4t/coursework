[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml4t-foundations"
version = "0.1.0"
description = "The project folder, component conformance checks and results log for the ML4T Foundations course"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Stefan Jansen" }]
keywords = ["trading", "machine-learning", "finance", "backtesting", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "pandas>=2.2", "pyarrow>=14.0", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://ml4trading.io"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["yfinance>=0.2.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t_foundations"]
artifacts = ["src/ml4t_foundations/data/*.csv"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
