[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml4t-coursework"
version = "0.3.0"
description = "Project folder, component conformance checks and results log for the ML4T courses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stefan Jansen" }]
keywords = ["trading", "machine-learning", "finance", "backtesting", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "pandas>=2.2", "pyarrow>=14.0", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/ml4t/coursework"
Repository = "https://github.com/ml4t/coursework"
Issues = "https://github.com/ml4t/coursework/issues"
Changelog = "https://github.com/ml4t/coursework/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.6", "twine==7.0.0"]
data = ["yfinance>=0.2.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t_coursework"]
artifacts = ["src/ml4t_coursework/data/*.csv", "src/ml4t_coursework/py.typed"]

[tool.hatch.build.targets.sdist]
exclude = ["/.workspace", "/publish.sh"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# One definition, used by CI and by a bare `ruff check` alike. E4/E7/E9/F is what
# ruff enforces with no configuration at all; I, UP and B are the three that pay
# for themselves here - import order, syntax this package's floor (3.10) already
# supports, and the bugbear checks that catch a real defect rather than a style
# preference. The wider default set is not adopted: S102 and BLE001 both fire on
# deliberate choices - `exec` rebuilds a student's saved component, and a broad
# `except` is what stops one wrong component from ending their session.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
