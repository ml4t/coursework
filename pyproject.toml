[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml4t-foundations"
version = "0.1.0"
description = "The project folder, component conformance checks and results log for the ML4T Foundations course"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Stefan Jansen" }]
dependencies = ["numpy>=1.24", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyarrow>=15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t_foundations"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
